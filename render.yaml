# Render Blueprint (무료 플랜). 디스크가 없으므로 상태는 Upstash Redis(무료)에 백업됩니다.
services:
  - type: web
    name: cosmoa
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /tmp/cosmoa
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
