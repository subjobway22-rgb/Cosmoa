# Render Blueprint: 저장소를 연결하면 이 파일로 서비스를 자동 생성합니다.
services:
  - type: web
    name: cosmoa
    runtime: docker
    plan: starter          # 영구 디스크는 유료 플랜 필요
    healthCheckPath: /
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true  # 대시보드 Environment에서 확인
      - key: DATA_DIR
        value: /var/data
    disk:
      name: cosmoa-data
      mountPath: /var/data
      sizeGB: 1
