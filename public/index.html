<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>코스모아 - 코스프레·서브컬처 행사</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>✦ 코스모아 <small>COSMOA</small></h1>
    <p class="sub">코스프레·서브컬처 행사를 한눈에, 같이 갈 사람을 찾아보세요</p>
    <div class="filters">
      <input id="q" type="search" placeholder="행사명·장소 검색">
      <select id="region"><option value="">전체 지역</option></select>
      <select id="period">
        <option value="upcoming">다가오는 행사</option>
        <option value="all">전체</option>
        <option value="past">지난 행사</option>
      </select>
    </div>
    <p id="meta" class="meta"></p>
    <button id="suggest-new" class="btn ghost" style="margin-top:8px">＋ 행사 제보하기</button>
  </div>
</header>
<main class="wrap"><div id="list" class="grid"></div><p id="empty" class="empty" hidden>조건에 맞는 행사가 없어요.</p></main>

<dialog id="dlg">
  <div class="dlg-head"><h2 id="d-title"></h2><button id="d-close" class="x" aria-label="닫기">✕</button></div>
  <div id="d-body"></div>
</dialog>
<dialog id="sdlg"><div class="dlg-head"><h2 id="s-title"></h2><button id="s-close" class="x" aria-label="닫기">✕</button></div><div id="s-body"></div></dialog>
<script src="/app.js"></script>
</body>
</html>
