# 하루 한 번 사이트를 깨워 일일 행사 수집이 돌게 합니다. Variables에 SITE_URL(예: https://사용자명-cosmoa.hf.space) 설정
name: Daily wake-up
on:
  schedule: [{ cron: "17 21 * * *" }]   # 매일 06:17 KST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ -n "${{ vars.SITE_URL }}" ] || { echo "SITE_URL 미설정"; exit 0; }
          curl -fsS --retry 5 --retry-delay 20 -m 120 "${{ vars.SITE_URL }}/api/events" -o /dev/null
