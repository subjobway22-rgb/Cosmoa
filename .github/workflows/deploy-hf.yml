# main에 푸시되면 Hugging Face Space(무료, 카드 불필요)로 자동 배포합니다.
# 필요한 설정: Secrets에 HF_TOKEN(쓰기 권한 토큰), Variables에 HF_SPACE(예: 사용자명/cosmoa)
name: Deploy to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE" ] || { echo "HF_TOKEN / HF_SPACE 미설정: 건너뜀"; exit 0; }
          cp deploy/huggingface/README.md README.md
          git config user.name "deploy"; git config user.email "deploy@users.noreply.github.com"
          git add -A && git commit -qm "deploy" || true
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
